name: Style Dictionary Workflow

run-name: ${{ github.actor }} is building tokens via style dictionary and publishing package

on:
  push:
    tags:
      # Style Dictionary v5 + DTCG migration moved this package to 1.x -
      # match any vN tag, not just v0.x.
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          # Style Dictionary v5 requires Node >= 22.
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install --frozen-lockfile
      - name: Build package
        uses: borales/actions-yarn@v4
        with:
          cmd: build
      - name: Verify build output
        uses: borales/actions-yarn@v4
        with:
          cmd: verify
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN }}
