name: CI

run-name: ${{ github.actor }} is checking the tokens

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Install Chromium for the cascade test
        run: npx playwright install --with-deps chromium
      - name: Palettes match their anchors
        run: yarn ramps:check
      - name: Build
        run: yarn build
      - name: Every brand meets the role contract
        run: yarn check-brand && yarn check-brand examples/white-label.css
      - name: Build output is complete and resolved
        run: yarn verify
      - name: Cascade works in a browser
        run: yarn test:cascade
